<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1c1c1e">
<title>Flipbook Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="btnNew">New</button>
    <button id="btnOpen">Open</button>
    <button id="btnSave">Save</button>
    <button id="btnExport" class="primary">Export</button>
    <span class="sep"></span>
    <button id="btnUndo">&#8630;</button>
    <button id="btnRedo">&#8631;</button>
    <span class="sep"></span>
    <button id="btnZoomOut">&minus;</button>
    <span id="zoomLabel">100%</span>
    <button id="btnZoomIn">+</button>
    <button id="btnFit">Fit</button>
    <button id="btnGrid">Grid</button>
    <button id="btnPanel">Panel</button>
    <input type="file" id="fileOpen" accept=".json,.flipbook,application/json" style="display:none">
    <input type="file" id="fileImg" accept="image/*" style="display:none">
  </header>

  <div id="main">
    <nav id="toolbar"></nav>

    <div id="stage"><canvas id="view"></canvas></div>

    <aside id="side">
      <section>
        <h4>Color</h4>
        <div class="colorrow"><div id="colorPrev"></div><input id="hex" type="text" maxlength="7" value="#222222" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <label class="sl">H <input id="hH" type="range" min="0" max="360" value="0"></label>
        <label class="sl">S <input id="hS" type="range" min="0" max="100" value="0"></label>
        <label class="sl">L <input id="hL" type="range" min="0" max="100" value="13"></label>
        <div id="swatches"></div>
      </section>

      <section>
        <h4>Tool</h4>
        <label class="sl">Size <input id="size" type="range" min="1" max="80" value="8"><span id="sizeVal">8</span></label>
        <label class="sl">Opacity <input id="opacity" type="range" min="5" max="100" value="100"><span id="opVal">100</span></label>
        <div id="optFill" style="display:none">
          <label class="sl">Tolerance <input id="tol" type="range" min="0" max="128" value="32"></label>
          <label class="chk"><input id="fillAll" type="checkbox"> Fill using all layers</label>
        </div>
        <div id="optShape" style="display:none">
          <label class="chk"><input id="shapeFill" type="checkbox"> Filled shape</label>
        </div>
      </section>

      <section>
        <h4>Selection / Edit</h4>
        <div class="grid3">
          <button id="btnRotL" title="Rotate left">&#8634;</button>
          <button id="btnRotR" title="Rotate right">&#8635;</button>
          <button id="btnFlipH" title="Flip horizontal">&#8596;</button>
          <button id="btnScaleDn" title="Smaller">&minus;</button>
          <button id="btnScaleUp" title="Bigger">+</button>
          <button id="btnFlipV" title="Flip vertical">&#8597;</button>
          <button id="btnCopy">Copy</button>
          <button id="btnPaste">Paste</button>
          <button id="btnImport">Image</button>
        </div>
        <div class="grid2">
          <button id="btnCommit">Apply</button>
          <button id="btnDelSel">Delete / Clear</button>
        </div>
        <p class="hint">Select a box, drag to move. With no selection, edits apply to the whole layer.</p>
      </section>

      <section>
        <h4>Layers</h4>
        <div id="layers"></div>
        <label class="sl">Opacity <input id="lopacity" type="range" min="0" max="100" value="100"></label>
        <div class="grid3">
          <button id="btnLAdd">+ Add</button>
          <button id="btnLDup">Copy</button>
          <button id="btnLDel">Delete</button>
          <button id="btnLUp">Up</button>
          <button id="btnLDown">Down</button>
          <button id="btnLRename">Rename</button>
        </div>
      </section>
    </aside>
  </div>

  <footer id="timeline">
    <div id="tlControls">
      <button id="btnPrev">&#9664;</button>
      <button id="btnPlay">&#9654;</button>
      <button id="btnNext">&#9654;&#9654;</button>
      <label class="inl">FPS <input id="fps" type="number" min="1" max="30" value="12"></label>
      <label class="inl"><input id="loop" type="checkbox" checked> Loop</label>
      <label class="inl">Onion
        <select id="onion"><option value="0">Off</option><option value="1" selected>1</option><option value="2">2</option></select>
      </label>
      <span class="sep"></span>
      <button id="btnFAdd">+ Frame</button>
      <button id="btnFDup">Copy</button>
      <button id="btnFDel">Delete</button>
      <button id="btnFLeft">&#9664; Move</button>
      <button id="btnFRight">Move &#9654;</button>
      <button id="btnHoldDn">Hold &minus;</button>
      <button id="btnHoldUp">Hold +</button>
      <button id="btnTween">Tween</button>
      <span id="frameInfo"></span>
    </div>
    <div id="strip"></div>
  </footer>
</div>

<div id="modal"><div class="box"><h3 id="mTitle"></h3><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="toast"></div>

<script src="gif.js"></script>
<script src="app.js"></script>
</body>
</html>
